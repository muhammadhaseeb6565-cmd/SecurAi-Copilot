name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  supabase_flutter: any
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  flutter_markdown_plus: ^1.0.12
  local_auth: ^2.1.8
  pdf: ^3.10.8
